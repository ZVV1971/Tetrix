name: "Workflow for feature branches"

on:
  push:
    branches: [ "feature/*", "bug/*", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .
  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release
  # Allow dotnet installation to a writable directory on self-hosted runners
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
        set-safe-directory: false

    - name: Check if .NET is Already Installed
      id: dotnet_check
      shell: pwsh
      run: |
        if (Get-Command dotnet -ErrorAction SilentlyContinue) {
          $version = dotnet --version
          Write-Host "dotnet is already installed: $version"
          echo "installed=true" >> $env:GITHUB_OUTPUT
        } else {
          Write-Host "dotnet is not installed, will install..."
          echo "installed=false" >> $env:GITHUB_OUTPUT
        }

    - name: Setup .NET
      if: steps.dotnet_check.outputs.installed == 'false'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Add .NET to PATH
      shell: pwsh
      run: echo "${{ env.DOTNET_INSTALL_DIR }}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: dotnet restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: dotnet build --configuration ${{env.BUILD_CONFIGURATION}} --no-restore ${{env.SOLUTION_FILE_PATH}}

    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration ${{env.BUILD_CONFIGURATION}}
