name: "Workflow for master and release branches"

on:
  push:
    branches: [ "release" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    permissions: write-all

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
        set-safe-directory: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Ensure GitHub CLI is Installed and in PATH
      shell: powershell
      run: |
          # 1. Install gh if missing on the runner host
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            Write-Host "gh executable not found. Installing via winget..."
            winget install --id GitHub.cli --exact --source winget --accept-package-agreements --accept-source-agreements
          }

          # 2. Add install path to GITHUB_PATH for remaining steps
          $ghInstallPath = "C:\Program Files\GitHub CLI"
          if (Test-Path $ghInstallPath) {
            echo "$ghInstallPath" >> $env:GITHUB_PATH
          }

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: dotnet restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: dotnet build --configuration ${{env.BUILD_CONFIGURATION}} --no-restore ${{env.SOLUTION_FILE_PATH}}

    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration ${{env.BUILD_CONFIGURATION}}

    - name: Publish
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: dotnet publish TetrisMainWindow/TetrisMainWindow.csproj --configuration ${{env.BUILD_CONFIGURATION}} --output ./publish-output --no-build

    - name: Sign the DLL & EXE files
      uses: dlemstra/code-sign-action@v1
      with:
          certificate: '${{ secrets.TNL_PFX }}'
          folder: './publish-output'
          recursive: true
          files: |
            Tetris.exe
            TetrisFigures.dll
          description: 'Signing of executables'

    - name: Prepare ZIP Archive
      #prepare ZIP only after it's pushed to main
      if: github.event_name == 'push'
      shell: pwsh
      run: |
          # Get the TITLE of the latest release
          $last_release = gh release list --limit 1;
          Write-Host $last_release;
          if(-not $last_release) {$last_release = '0.0.0.0'};
          Write-Host $last_release;
          
          # Calculate the version number of the current release
          $releasenumber = $(${env:GitBuildVersionSimple} + ".0");
          Write-Host $releasenumber;
          
          # Compare the versions of the current release with the version of the lastest one
          # and increment the revision number
          if ($releasenumber -eq $last_release.Split()[0]) {
            $releasenumber = $($releasenumber.Split(".")[0] + "."+$releasenumber.Split(".")[1] + "."+ $releasenumber.Split(".")[2] + "."+ ([int]($releasenumber.Split(".")[3]) + 1).ToString());
          };
          Write-Host $releasenumber;
          
          # Make the Zipped version of the release
          Compress-Archive -Path ./publish-output/* -DestinationPath ./TetrisMainWindow/$("Tetrix." + $releasenumber + ".zip");
          
          # Post release
          gh release create  $releasenumber ./TetrisMainWindow\$("Tetrix." + $releasenumber + ".zip") ;
      continue-on-error: true


