name: AI Code Review (Gemini)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: self-hosted
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Native AI Review via API
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # 1. Fetch the raw PR Diff from GitHub
          $ghHeaders = @{
              "Authorization" = "Bearer $env:GITHUB_TOKEN"
              "Accept" = "application/vnd.github.v3.diff"
              "X-GitHub-Api-Version" = "2022-11-28"
          }
          $diffUrl = "https://api.github.com/repos/$env:REPO/pulls/$env:PR_NUMBER"
          $diff = Invoke-RestMethod -Uri $diffUrl -Headers $ghHeaders -Method Get

          if ([string]::IsNullOrWhiteSpace($diff)) {
              Write-Output "No code changes found."
              exit 0
          }

          # Truncate diff if too large (e.g., max 40,000 chars)
          $maxDiffLen = 40000
          if ($diff.Length -gt $maxDiffLen) {
              $diff = $diff.Substring(0, $maxDiffLen) + "`n`n[Diff truncated due to length limits...]"
          }

          # 2. Construct JSON payload and call Gemini
          $geminiUrl = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=$env:GEMINI_API_KEY"
          $prompt = "You are a senior code reviewer. Review the following GitHub PR diff and provide constructive feedback on potential bugs, logic errors, or code quality. Format your response in Markdown.`n`n$diff"
          
          $payload = @{
              system_instruction = @{
                  parts = @( @{ text = "You are a senior code reviewer. Review the provided GitHub PR diff for potential bugs, logic errors, or performance issues. Provide feedback in Markdown." } )
              }
              contents = @(
                  @{ parts = @( @{ text = "PR Diff:`n`n$diff" } ) }
              )
          }
          $jsonPayload = $payload | ConvertTo-Json -Depth 10

          try {
              $geminiResponse = Invoke-RestMethod -Uri $geminiUrl -Method Post -Body $jsonPayload -ContentType "application/json; charset=utf-8"
              $reviewText = $geminiResponse.candidates[0].content.parts[0].text
          } catch {
              Write-Error "Failed to get review from Gemini API: $_"
              exit 1
          }

          if ([string]::IsNullOrWhiteSpace($reviewText)) {
              Write-Output "Gemini returned an empty review or was blocked by safety filters."
              exit 0
          }

          # 3. Post the response as a PR comment
          $commentUrl = "https://api.github.com/repos/$env:REPO/issues/$env:PR_NUMBER/comments"
          $commentBody = @{ body = "### AI Code Review`n`n$reviewText" } | ConvertTo-Json -Depth 5
          
          $postHeaders = @{
              "Authorization" = "Bearer $env:GITHUB_TOKEN"
              "Accept" = "application/vnd.github.v3+json"
          }
          Invoke-RestMethod -Uri $commentUrl -Headers $postHeaders -Method Post -Body $commentBody -ContentType "application/json"
